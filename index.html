<!DOCTYPE html>
<!--
  AudioMirroring 커스텀 Cast Web Receiver (CAF + Shaka LL-DASH)

  역할:
   - 폰이 서빙하는 LL-DASH 매니페스트(/dash/index.mpd)를 저지연 라이브로 재생
   - 측정한 live latency를 폰의 HTTP 엔드포인트(/latency)로 POST 리포트
   - 폰은 이 값을 setMusicShareSyncDelay(L)에 투입해 비디오를 오디오에 맞춤
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>AudioMirroring Receiver</title>
  <!-- CAF Web Receiver SDK (내부적으로 shaka-player 사용) -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    cast-media-player { --background-color: #000; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <!-- 캐시 버스팅: receiver.js 수정 시 ?v= 값을 같이 올릴 것 -->
  <script src="receiver.js?v=15"></script>
</body>
</html>
